name: Golden Eval

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of golden queries to run"
        required: false
        default: "5"
      judge:
        description: "Run LLM-as-judge scoring"
        required: false
        default: "false"

jobs:
  golden-eval:
    name: Golden Eval
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      COPILOT_API_KEY: eval-api-key
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run golden eval without judge
        if: ${{ inputs.judge == 'false' }}
        run: |
          python -m evals.run_golden_eval --limit "${{ inputs.limit }}" --save-db

      - name: Run golden eval with judge
        if: ${{ inputs.judge == 'true' }}
        run: |
          python -m evals.run_golden_eval --limit "${{ inputs.limit }}" --judge --save-db

      - name: Generate eval report
        run: |
          python -m evals.generate_report

      - name: Upload eval artifacts
        uses: actions/upload-artifact@v4
        with:
          name: golden-eval-results
          path: |
            evals/results/latest_golden_eval.json
            evals/results/eval_runs.sqlite3
            evals/reports/latest_eval_report.md
