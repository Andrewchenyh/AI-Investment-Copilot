services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-investment-copilot-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: ai-investment-copilot-redis
    volumes:
      - redis_data:/data

volumes:
  redis_data: